<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results — Surrounded</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --amber:#ffb84d;
  --coral:#ff6f61;
  --porcelain:#f5efe6;
  --dim:#9a9aa4;
  --ring:rgba(245,239,230,0.13);
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
html,body{
  width:100%;
  min-height:100%;
  background:#050505;
  font-family:'Inter',sans-serif;
  color:var(--porcelain);
}
body{
  background:radial-gradient(circle at 50% 30%, #1a150e 0%, #080808 55%, #050505 100%);
  padding:70px 24px 90px;
}
@media (prefers-reduced-motion: reduce){
  *{
    animation-duration:0.01ms !important;
    transition-duration:0.01ms !important;
  }
}

.results-inner{max-width:900px; margin:0 auto; text-align:center;}
.results-eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:10px;
  letter-spacing:.25em; text-transform:uppercase; color:var(--amber);
  margin-bottom:16px;
  opacity:0; animation:fade-up .8s ease .1s forwards;
}
.results-type{
  font-family:'Fraunces',serif; font-weight:600;
  font-size:clamp(72px,15vw,150px); line-height:.9;
  letter-spacing:.04em; color:var(--amber);
  text-shadow:0 0 40px rgba(255,184,77,.28);
  margin-bottom:12px;
  opacity:0; animation:fade-up .8s ease .25s forwards;
}
.results-name{
  font-family:'Fraunces',serif; font-style:italic;
  font-size:clamp(24px,4vw,38px); color:var(--porcelain);
  margin-bottom:18px;
  opacity:0; animation:fade-up .8s ease .4s forwards;
}
.results-note{
  max-width:600px; margin:0 auto 42px;
  font-family:'Fraunces',serif; font-style:italic;
  font-size:18px; line-height:1.6; color:var(--porcelain);
  opacity:0; animation:fade-up .8s ease .55s forwards;
}
@keyframes fade-up{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}
.results-note b{
  font-style:normal; font-weight:600; color:var(--amber);
}

.photo-grid{
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:14px; max-width:720px; margin:0 auto 36px;
  opacity:0; animation:fade-up .8s ease .7s forwards;
}
.photo-card{
  aspect-ratio:1/1; overflow:hidden; border-radius:14px;
  border:1px solid var(--ring); background:#111114;
}
.photo-card img{
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .35s ease;
}
.photo-card:hover img{transform:scale(1.04);}
.photo-card.placeholder{
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, rgba(255,111,97,.14), rgba(255,184,77,.14));
}
.photo-card.placeholder::after{
  content:'0' attr(data-n);
  font-family:'JetBrains Mono',monospace;
  font-size:11px; letter-spacing:.08em;
  color:rgba(245,239,230,.35);
}
.photo-card.placeholder[data-n="10"]::after,
.photo-card.placeholder[data-n="11"]::after,
.photo-card.placeholder[data-n="12"]::after{
  content:attr(data-n);
}

.results-back{
  font-family:'JetBrains Mono',monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase;
  display:inline-block;
  background:transparent; color:var(--dim); text-decoration:none;
  border:1px solid var(--ring); border-radius:100px;
  padding:10px 18px; cursor:pointer; transition:.25s ease;
  opacity:0; animation:fade-up .8s ease .85s forwards;
}
.results-back:hover{border-color:var(--amber); color:var(--amber);}

@media(max-width:600px){
  body{padding:55px 14px 70px;}
  .photo-grid{gap:8px;}
  .photo-card{border-radius:9px;}
}
</style>
</head>
<body>

<div class="results-inner">
  <div class="results-eyebrow">The verdict</div>
  <div class="results-type" id="results-type"></div>
  <div class="results-name" id="results-name"></div>
  <p class="results-note" id="results-note"></p>

  <div class="photo-grid" id="photo-grid">
    <div class="photo-card" data-n="1"><img src="photos/01.jpg" alt="Memory 1" loading="lazy"></div>
    <div class="photo-card" data-n="2"><img src="photos/02.jpg" alt="Memory 2" loading="lazy"></div>
    <div class="photo-card" data-n="3"><img src="photos/03.jpg" alt="Memory 3" loading="lazy"></div>
    <div class="photo-card" data-n="4"><img src="photos/04.jpg" alt="Memory 4" loading="lazy"></div>
    <div class="photo-card" data-n="5"><img src="photos/05.jpg" alt="Memory 5" loading="lazy"></div>
    <div class="photo-card" data-n="6"><img src="photos/06.jpg" alt="Memory 6" loading="lazy"></div>
    <div class="photo-card" data-n="7"><img src="photos/07.jpg" alt="Memory 7" loading="lazy"></div>
    <div class="photo-card" data-n="8"><img src="photos/08.jpg" alt="Memory 8" loading="lazy"></div>
    <div class="photo-card" data-n="9"><img src="photos/09.jpg" alt="Memory 9" loading="lazy"></div>
    <div class="photo-card" data-n="10"><img src="photos/10.jpg" alt="Memory 10" loading="lazy"></div>
    <div class="photo-card" data-n="11"><img src="photos/11.jpg" alt="Memory 11" loading="lazy"></div>
    <div class="photo-card" data-n="12"><img src="photos/12.jpg" alt="Memory 12" loading="lazy"></div>
  </div>

  <a class="results-back" href="index.html">Back to the table</a>
</div>

<script>
/* ============================================================
   Single source of truth for the verdict + birthday note.
   Keep this in sync with the FINALE object in index.html
   (same fields: type, typeName, note).
   ============================================================ */
const FINALE = {
  type: "ENFP",
  typeName: "The Campaigner",
  note:
    "Happy birthday, <b>yugam</b>. 100+ questions, one honest answer each — this is how I see you, and I hope some of it is how you see yourself too. I know you're probaby gonna say you're I, not E but stfu and this is how you have been perceived. <33 happiest birthday yugam, you're a gem!!! congratulations on turning 22, told you you'd make it here and we should head out and get a pint soon! missing our hangouts, thank you for being one of my best friends ever :D now stop brooding and go get sloshed."
};

document.getElementById('results-type').textContent = FINALE.type;
document.getElementById('results-name').textContent = FINALE.typeName;
document.getElementById('results-note').innerHTML = FINALE.note;

// Swap in a soft numbered placeholder for any photo that hasn't
// been dropped into /photos/ yet, instead of a broken image icon.
document.querySelectorAll('.photo-card img').forEach(img => {
  img.addEventListener('error', () => {
    const card = img.closest('.photo-card');
    card.classList.add('placeholder');
    img.remove();
  }, { once: true });
});
</script>

</body>
</html>
